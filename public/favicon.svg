<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Top dome gradient -->
    <linearGradient id="topDome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Bottom dome gradient -->
    <linearGradient id="bottomDome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6" />
      <stop offset="60%" stop-color="#e5e7eb" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>

    <!-- Button gradient -->
    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e5e7eb" />
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <clipPath id="ballClip">
      <circle cx="60" cy="60" r="54" />
    </clipPath>
  </defs>

  <!-- Outer Ball Container with shadow -->
  <g filter="url(#shadow)">
    <!-- Base dark border -->
    <circle cx="60" cy="60" r="56" fill="#18181b" />

    <!-- Clipped sphere contents -->
    <g clip-path="url(#ballClip)">
      <!-- Top red half -->
      <path d="M6 60 A54 54 0 0 1 114 60 Z" fill="url(#topDome)" />
      
      <!-- Top specular gloss reflection -->
      <ellipse cx="60" cy="30" rx="36" ry="16" fill="#ffffff" opacity="0.25" />

      <!-- Bottom white half -->
      <path d="M6 60 A54 54 0 0 0 114 60 Z" fill="url(#bottomDome)" />

      <!-- Dark dividing middle band -->
      <rect x="0" y="55" width="120" height="10" fill="#18181b" />
    </g>

    <!-- Center Button Structure -->
    <!-- Outer black ring -->
    <circle cx="60" cy="60" r="19" fill="#18181b" />
    
    <!-- White inner ring -->
    <circle cx="60" cy="60" r="12" fill="url(#buttonGrad)" stroke="#18181b" stroke-width="2.5" />

    <!-- Center push button -->
    <circle cx="60" cy="60" r="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1" />
    <circle cx="58.5" cy="58.5" r="2" fill="#ffffff" />
  </g>
</svg>
